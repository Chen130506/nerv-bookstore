<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>NERV书店 - 个人主页</title>
		<link rel="stylesheet" href="../css/personInfo.css" />
		<script src="../js/personInfo.js" defer></script>
	</head>
	<body>
		<div class="info-box">
			<div class="list-button">
				<ul>
					<li onclick="showPage('home')" class="active">首页</li>
					<li onclick="showPage('info')">我的信息</li>
					<li onclick="showPage('avatar')">我的头像</li>
					<li onclick="showPage('records')">我的记录</li>
					<li onclick="showPage('setting')">设置</li>
				</ul>
			</div>
			<div class="content">
				<!-- 首页内容 -->
				<div id="home-page" class="page active">
					<h1>个人主页</h1>
					<p>这里是您的个人中心首页。</p>
				</div>

				<!-- 我的信息内容 -->
				<div id="info-page" class="page">
					<h1>我的信息</h1>
					<p>这里是您的个人信息页面。</p>
				</div>

				<!-- 我的头像内容 -->
				<div id="avatar-page" class="page">
					<h1>我的头像</h1>
					<p>这里是您的头像设置页面。</p>
				</div>

				<!-- 我的记录内容 -->
				<div id="records-page" class="page">
					<h1>我的记录</h1>
					<p>这里是您的浏览和购买记录。</p>
				</div>
				<!--设置-->
				<div id="setting-page" class="page">
					<h1>设置</h1>
					<hr />
					<p>清除缓存</p>
					<button onclick="localStorage.removeItem('nerv-users')">清除用户数据</button>
					<button onclick="localStorage.removeItem('cart')">清除购物车记录</button>
					<button onclick="localStorage.removeItem('orders')">清除订单记录</button>
					<br />
					<button onclick="localStorage.clear()" class="clear">清除所有缓存数据</button>
				</div>
			</div>
		</div>
	</body>
</html>
